version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bhumi3d.db
      - SECRET_KEY=bhumi3d_sih2026_secure_secret_key
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: bhumi3d
      POSTGRES_USER: bhumi
      POSTGRES_PASSWORD: bhumipassword
    ports:
      - "5432:5432"
